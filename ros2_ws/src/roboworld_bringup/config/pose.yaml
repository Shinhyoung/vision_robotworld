# 6D pose estimation (claude.md section 3.3).
/**:
  ros__parameters:
    pose:
      # Backend: "foundationpose" (Isaac ROS, GPU)
      #          "icp"            (Open3D/numpy registration, CPU reference)
      #          "stub"           (fixed nominal pose, dry-run only)
      backend: "icp"

      # Frame the published pose is expressed in. "camera_color_optical_frame"
      # is always available; "world" requires the TF chain from the robot
      # department (see ICD section 4 and the calibration responsibility note).
      output_frame_id: "camera_color_optical_frame"
      # If true and TF is available, additionally transform into output_frame_id;
      # if the transform is missing the pose is published in the optical frame
      # and `message` records the fallback.
      transform_to_output_frame: false

      # Acceptance gate. A pose failing any of these is published with
      # valid=false and the pipeline emits STATUS_NO_POSE.
      min_fitness: 0.35
      max_rmse_m: 0.006
      # Sanity window on the part center in the camera optical frame, meters.
      valid_z_range_m: [0.30, 1.00]
      max_lateral_offset_m: 0.25

      icp:
        model_points: 2000        # surface samples from the CAD mesh
        scene_max_points: 600     # random subsample of the segmented scene cloud
        voxel_size_m: 0.003
        max_iterations: 40
        tolerance_m: 1.0e-5
        # Yaw seeds are scored with a cheap decimated pass; only the winner gets
        # the full refinement. Registering all seeds at full resolution costs
        # ~8x wall time for no accuracy gain.
        coarse_iterations: 12
        coarse_model_points: 900
        coarse_scene_points: 300
        # Correspondences farther than this are rejected each iteration; the
        # schedule shrinks from coarse to fine across iterations.
        max_correspondence_start_m: 0.030
        max_correspondence_end_m: 0.006
        # Initial-guess hypotheses. A block on a belt rests on one of its four
        # long faces, with the long axis pointing either way: 4 x 2 = 8 discrete
        # seeds. +/-x is excluded because a 200 mm block does not stand on end.
        resting_faces: ["+y", "-y", "+z", "-z"]
        try_long_axis_flip: true
        # Percentile of the cloud treated as "the surface facing the camera"
        # when anchoring the initial depth (a plain max would latch onto noise).
        surface_percentile: 98.0
        use_open3d: true          # falls back to the numpy ICP when unavailable

      segmentation:
        # Remove the conveyor plane before registration.
        plane_ransac_iterations: 120
        plane_distance_threshold_m: 0.006

        # Pull the depth mask's boundary in onto the colour edge.
        #
        # A stereo camera fattens: the matcher paints object depth onto a band
        # of background pixels around the silhouette. Measured on a part known
        # to be 49 mm wide, the depth mask read 53.6 mm, and the skirt is stable
        # across frames (so averaging cannot remove it) and worse at 848x480
        # (so resolution cannot either). The colour image has the boundary in
        # the right place.
        #
        # Depth still decides WHICH pixels are the part; this only relocates an
        # existing boundary, inward, by at most max_shift_px. That bound is what
        # keeps a stain or a chip on the rim from carving a piece out of the
        # part -- segmentation otherwise refuses colour precisely because the
        # defects Inspection hunts for are colour features too.
        #
        # Measured over 10 frames against the true 230 x 49 x 51 mm:
        #   off                       worst axis 5.1 %
        #   inward, max_shift 3 px    worst axis 2.7 %
        #   both directions           worst axis 18.6 % -- it locked onto the
        #                             rollers' own specular edges
        color_edge_snap:
          enabled: true
          max_shift_px: 3
          # Sobel magnitude a candidate edge must reach before the boundary is
          # moved onto it. Below this the depth boundary stands.
          min_gradient: 8.0

        # What the part is resting on. Every height is measured from this, so
        # putting it in the wrong place biases every height.
        #
        #   "plane"  - the RANSAC plane is the support surface. Correct for a
        #              flat belt.
        #   "crowns" - refit onto the top of the support band. For a ROLLER or
        #              ribbed conveyor, where the cloud contains both the roller
        #              crowns and the gaps between them: RANSAC fits that
        #              mixture and lands below the surface the part rests on.
        #
        # Measured on a D455 capture of a part known to be 51 mm tall, on the
        # roller conveyor: "plane" read 71.1 mm (+39 %), "crowns" reads 49.7 mm
        # (-2.6 %). Widening plane_distance_threshold_m does NOT fix it --
        # swept 3 to 30 mm, the height stayed 71-73 mm, because the problem is
        # which surface gets fitted, not how tolerantly.
        support_surface:
          mode: "crowns"
          # Percentile of the support band treated as the crowns. Tuned on that
          # capture: 90 -> 64 mm, 95 -> 50 mm, 99 -> 43 mm. Too high and the
          # datum climbs onto noise above the crowns.
          crown_percentile: 95.0
          # Thickness of the slice kept below that percentile. 3 mm; at 10 mm
          # the gaps leak back in and the height climbs to 63 mm.
          crown_slab_m: 0.003
          # How far either side of the first plane fit to look for the support
          # surface. Must clear the roller relief but stay under the part.
          band_m: 0.035
        # Keep only points within this height band above the detected plane.
        min_height_above_plane_m: 0.008
        max_height_above_plane_m: 0.120
        min_cluster_points: 300

        # Identify the part by its dimensions instead of taking the largest
        # object on the surface. Without this a hand, a tool or a neighbouring
        # part gets inspected and pose-estimated as if it were the part.
        # Requires the part to have geometry; parts registered without a mesh
        # fall back to largest-object.
        identify_by_size: true
        # Allowed relative error on the worst of (length, width, height).
        # 0.25 accommodates depth noise, the silhouette dilation segmentation
        # applies, and a partly occluded part, while still rejecting anything
        # that is not roughly the right shape. Tighten it when several similar
        # parts share the station.
        size_tolerance: 0.25


        # The volume, in the camera optical frame, that a part must occupy to
        # count as "at the station". Dimension matching above answers *is this
        # the right part*; it cannot answer *is this the one that stopped in
        # front of the camera*, because the next identical part on the belt
        # matches just as well. Measured: at 200 mm part spacing the pipeline
        # published the pose of the FOLLOWING part (y = +0.195 m).
        #
        # A box in meters, not an image rectangle, so the numbers come off the
        # conveyor drawing and survive a resolution or lens change. It is NOT
        # robust to moving the camera -- that needs a station frame and TF,
        # still open with the robot department (ICD section 4).
        #
        # This is unrelated to the pixels inspection scores: those come from the
        # depth silhouette mask, and replacing that with a rectangle would mix
        # belt background into the anomaly statistics.
        station_roi:
          enabled: true
          # MEASURED on the roller conveyor with a D455 (10 frames, part centre
          # stable to [4, 1, 2] mm): the part sits at [16, -9, 626] mm, with the
          # camera re-aimed so it looks down the part's own axis (1.7 deg off).
          # An earlier design guess of [0, 0, 0.60] was off by 174 mm in y and
          # detection was 0/10 frames -- measure this, do not assume it.
          #
          # RE-MEASURE THIS WHENEVER THE CAMERA MOVES. It is a camera-frame box
          # (see the note above), so a rig change invalidates it. The quickest
          # check is `tools/live_view.py --source realsense --inspect`: the HUD
          # prints how far outside the box the part is.
          center_m: [0.02, -0.01, 0.63]
          # Widened from +/-[150, 150, 120] mm. Centring on the real stop
          # position is what actually recovers detection (10/10 frames); the
          # extra width is margin for part-to-part placement scatter.
          #
          # Upper bound comes from the neighbour this gate exists to reject: a
          # follower at spacing S is excluded only while half_extent < S. At the
          # agreed 500 mm minimum spacing +/-200 mm leaves 300 mm of margin.
          # Note it no longer separates a 200 mm spacing -- that was a
          # stress-test below the agreed spec, and +/-190 mm would be the limit.
          #
          # Once the belt travel direction is known this can be tightened along
          # that axis, which is where neighbours actually appear.
          half_extents_m: [0.20, 0.20, 0.15]

      foundationpose:
        # NOTE (claude.md section 1): the public FoundationPose release is
        # NON-COMMERCIAL. Demo use only; switch to the NGC commercial build
        # before productisation.
        mesh_dir: "${ROBOWORLD_ASSETS_DIR}"
        refine_iterations: 5
        track: false              # index station is stop-and-go, not tracking
        device: "cuda"
