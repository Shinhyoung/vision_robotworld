# Surface defect inspection (claude.md section 3.2).
# Thresholds are externalised here -- never hardcode them (section 4).
/**:
  ros__parameters:
    inspection:
      # Backend: "efficientad" (anomalib, needs GPU + trained checkpoint)
      #          "statistical" (numpy patch-Mahalanobis, CPU, no training deps)
      #          "stub"        (ground-truth passthrough, dry-run only)
      backend: "statistical"

      # OK/NG decision. score > threshold => NG.
      threshold: 0.50
      # When a model is (re)trained, the threshold is recalibrated to this
      # percentile of the normal-set score distribution plus a safety margin,
      # then clamped into [threshold_min, threshold_max].
      calibration_percentile: 99.0
      calibration_margin: 0.05
      threshold_min: 0.10
      threshold_max: 0.95

      # Pixels above this fraction of the map maximum enter the defect mask.
      mask_relative_threshold: 0.55
      # NG also requires a connected defect of at least this many pixels,
      # which suppresses single-pixel sensor noise firing a false reject.
      min_defect_area_px: 12

      publish_anomaly_map: true
      publish_defect_mask: true

      statistical:
        patch_size: 16          # feature grid cell, pixels
        stride: 8
        blur_sigma_px: 2.0      # smoothing applied to the raw score map
        regularization: 1.0e-3  # added to the covariance diagonal
        # Score normalisation. Image raw scores are mapped through
        #   score = clip(0.5 * raw / (safety_factor * hi), 0, 1)
        # where hi is the norm_high_percentile of the TRAINING score
        # distribution. Score 0.5 therefore sits `safety_factor` times above the
        # normal upper percentile: raise safety_factor if good parts are being
        # rejected, lower it if defects slip through.
        #
        # (95, 1.6) was selected by sweeping both over measured raw scores for
        # all three parts at 40 and 80 training frames: 0 missed defects out of
        # 150 and 2 false rejects out of 150 (tools/evaluate.py). Both false
        # rejects are the same extreme-placement guide_block frame, whose raw
        # score genuinely overlaps the weak-defect range -- see
        # docs/architecture.md section 7. Re-measure on real captures; do not
        # carry these numbers over blindly.
        norm_low_percentile: 50.0     # diagnostics only
        norm_high_percentile: 95.0
        safety_factor: 1.6
        model_path: "${ROBOWORLD_DATA_DIR}/models/statistical_${part_id}.npz"

      efficientad:
        # Score normalisation, same shape as the statistical backend's but with
        # its OWN numbers -- the two detectors put defects at completely
        # different multiples of the normal level, so sharing one safety_factor
        # is not a saving, it is a miscalibration. Measured on 64 real captures
        # of new_part: borrowing statistical's 1.6 put score 0.5 above most real
        # defects (min 0.36) and missed 3 of 19; the separation itself was fine.
        #
        # Lower safety_factor if defects slip through, raise it if good parts are
        # rejected. Retrain after changing it -- the anchor is baked into the
        # .norm.json beside the checkpoint.
        #
        # (95, 4.0) chosen by sweeping both over measured raw scores of the
        # medium model on 82 real single-face captures of new_part: 0 false
        # rejects of 21 and 0 misses of 19, with no frame clipped at 1.0.
        # Neighbouring values were worse in a specific way -- 3.0 clipped 5
        # frames, 5.0 started missing defects -- and clipping is the one to
        # avoid: once a score saturates, "faint defect" and "blatant defect"
        # read the same and the margin can no longer be monitored.
        #
        # This constant belongs to a (model_size, dataset) pair. Re-sweep after
        # changing either; the small model wanted a value 6x lower.
        norm_high_percentile: 95.0
        safety_factor: 4.0
        model_path: "${ROBOWORLD_DATA_DIR}/models/efficientad_${part_id}.ckpt"
        image_size: [256, 256]
        device: "cuda"
        # "medium" is ~4x the teacher/student capacity of "small". Measured
        # on 82 real single-face captures, "small" left the raw scores
        # overlapping before any normalisation -- a good part reached 0.397
        # where the faintest defect sat at 0.310 -- so no threshold could
        # separate them. Capacity is the lever there, not calibration.
        model_size: "medium"    # anomalib EfficientAd: "small" | "medium"

      training:
        # Normal (defect-free) images used to fit the model.
        # EfficientAD trains from PNG folders, laid out as
        #   <dataset_dir>/<part_id>/normal/*.png
        # which is what tools/export_mock_images.py writes. The previous value
        # pointed at data/mock/train, which no tool ever creates -- the mock
        # dataset is data/mock/<part_id>/ and the PNG export is data/mock_images.
        # Point this at real captures once defect-free frames have been shot.
        dataset_dir: "${ROBOWORLD_DATA_DIR}/mock_images"
        # EfficientAD is a distillation objective; it keeps improving well
        # past the point the loss looks flat. 20 was a smoke-test value.
        max_epochs: 100
        batch_size: 1

        # Modified z-score above which a training frame is left out of the
        # normalisation calibration (high side only -- a low score is a clean
        # part, not contamination). The anchor is a high percentile, so a few
        # bad frames drag it up and push real defects under the threshold.
        # Measured on 64 real captures: one frame with the operator's hand in
        # shot scored 23x the median, lifting p95 from 0.219 to 0.347 and
        # costing 12 of 19 defects. Excluded frames are printed, not dropped
        # silently -- they usually want deleting from the capture set too.
        # 3.5 is the textbook value, and it was right when the normal set
        # spanned several part faces. On a single-face set the spread
        # collapses, MAD with it, and ordinary frames at 1.8x the median
        # start tripping it -- 11 of 82 were excluded, which moves the
        # anchor as much as the contamination it was meant to catch.
        # 6.0 still isolates real contamination (the hand-in-shot frame
        # measured z=132) without eating the distribution's own shoulder.
        outlier_z_max: 6.0
